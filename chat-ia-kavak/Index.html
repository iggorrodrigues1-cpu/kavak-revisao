<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --border: #e2e4e9;
      --text: #1f2430;
      --muted: #6b7280;
      --accent: #2f6f4f;
      --accent-dark: #234f39;
      --bubble-user: #2f6f4f;
      --bubble-ai: #eef1f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.4; font-size: 14px; }
    .msg.user { align-self: flex-end; background: var(--bubble-user); color: #fff; border-bottom-right-radius: 2px; }
    .msg.ai { align-self: flex-start; background: var(--bubble-ai); border-bottom-left-radius: 2px; }
    .msg table { border-collapse: collapse; width: 100%; margin-top: 6px; font-size: 13px; }
    .msg th, .msg td { border: 1px solid #d0d3d8; padding: 4px 8px; text-align: left; }
    .msg th { background: #dfe7e3; }
    .msg .feedback-link {
      display: inline-block;
      margin-top: 6px;
      font-size: 12px;
      color: var(--accent-dark);
      cursor: pointer;
      text-decoration: underline;
    }
    #inputBar {
      display: flex;
      gap: 8px;
      padding: 14px;
      background: var(--panel);
      border-top: 1px solid var(--border);
    }
    #inputBar input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
    }
    #inputBar button, .modal button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    #inputBar button:disabled { opacity: 0.6; cursor: default; }
    .modal-backdrop {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      align-items: center; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--panel);
      border-radius: 10px;
      padding: 20px;
      width: min(420px, 90vw);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal h3 { margin: 0 0 4px; }
    .modal textarea, .modal input {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
    }
    .modal .actions { display: flex; justify-content: flex-end; gap: 8px; }
    .modal .actions .cancel { background: #d5d8dd; color: #333; }
    .loading { font-size: 13px; color: var(--muted); font-style: italic; }
    .sources { font-size: 11px; color: var(--muted); margin-top: 6px; }
  </style>
</head>
<body>

  <header>Chat IA Kavak — Planilhas Corporativas</header>

  <div id="chat"></div>

  <div id="inputBar">
    <input type="text" id="userInput" placeholder="Pergunte algo sobre as planilhas..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button id="sendBtn" onclick="sendMessage()">Enviar</button>
  </div>

  <div class="modal-backdrop" id="feedbackModal">
    <div class="modal">
      <h3>Corrigir resposta</h3>
      <p style="font-size:13px;color:#6b7280;margin:0;">Explique qual é a informação correta. Isso será salvo na memória e usado em respostas futuras.</p>
      <textarea id="correctionText" rows="3" placeholder="Ex: o valor correto de estoque para o modelo X é Y, não Z."></textarea>
      <div class="actions">
        <button class="cancel" onclick="closeFeedbackModal()">Cancelar</button>
        <button onclick="submitCorrection()">Salvar correção</button>
      </div>
    </div>
  </div>

  <script>
    let lastQuestion = '';
    let lastAnswer = '';

    function appendMessage(text, role, sources) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.innerHTML = role === 'ai' ? renderMarkdown(text) : escapeHtml(text);

      if (role === 'ai') {
        if (sources && sources.length) {
          const src = document.createElement('div');
          src.className = 'sources';
          src.textContent = 'Fontes consultadas: ' + sources.join(', ');
          div.appendChild(src);
        }
        const link = document.createElement('span');
        link.className = 'feedback-link';
        link.textContent = 'Corrigir essa resposta';
        link.onclick = openFeedbackModal;
        div.appendChild(document.createElement('br'));
        div.appendChild(link);
      }

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Suporte simples a tabelas em Markdown (| col | col |) e quebras de linha.
    function renderMarkdown(text) {
      const escaped = escapeHtml(text);
      const lines = escaped.split('\n');
      let html = '';
      let inTable = false;
      let tableRows = [];

      function flushTable() {
        if (!tableRows.length) return;
        const headerCells = tableRows[0].split('|').map(c => c.trim()).filter(Boolean);
        const bodyRows = tableRows.slice(2); // pula linha separadora ---
        html += '<table><thead><tr>' + headerCells.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>';
        bodyRows.forEach(r => {
          const cells = r.split('|').map(c => c.trim()).filter(Boolean);
          html += '<tr>' + cells.map(c => '<td>' + c + '</td>').join('') + '</tr>';
        });
        html += '</tbody></table>';
        tableRows = [];
      }

      lines.forEach(line => {
        if (line.trim().startsWith('|')) {
          inTable = true;
          tableRows.push(line.trim());
        } else {
          if (inTable) { flushTable(); inTable = false; }
          html += line + '<br>';
        }
      });
      if (inTable) flushTable();

      return html;
    }

    function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      lastQuestion = text;
      input.value = '';
      document.getElementById('sendBtn').disabled = true;

      const loadingDiv = appendMessage('Consultando planilhas...', 'ai');
      loadingDiv.classList.add('loading');

      google.script.run
        .withSuccessHandler(function (result) {
          loadingDiv.remove();
          document.getElementById('sendBtn').disabled = false;
          lastAnswer = result.answer;
          appendMessage(result.answer, 'ai', result.fontesConsultadas);
        })
        .withFailureHandler(function (err) {
          loadingDiv.remove();
          document.getElementById('sendBtn').disabled = false;
          appendMessage('Erro ao consultar: ' + err.message, 'ai');
        })
        .processUserMessage(text);
    }

    function openFeedbackModal() {
      document.getElementById('feedbackModal').classList.add('open');
    }

    function closeFeedbackModal() {
      document.getElementById('feedbackModal').classList.remove('open');
      document.getElementById('correctionText').value = '';
    }

    function submitCorrection() {
      const correction = document.getElementById('correctionText').value.trim();
      if (!correction) return;

      google.script.run
        .withSuccessHandler(function () {
          closeFeedbackModal();
          appendMessage('Correção registrada. Vou levar isso em conta nas próximas respostas.', 'ai');
        })
        .withFailureHandler(function (err) {
          alert('Erro ao salvar correção: ' + err.message);
        })
        .saveCorrection(lastQuestion, lastAnswer, correction);
    }
  </script>
</body>
</html>
